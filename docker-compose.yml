# Orquestación base común a todos los entornos.
#
#   Development: docker compose up -d --build                     (carga docker-compose.override.yml)
#   Staging:     docker compose -p distribucion-polar-staging --env-file .env.staging \
#                  -f docker-compose.yml -f docker-compose.staging.yml up -d --build
#   Production:  docker compose -p distribucion-polar-prod --env-file .env.production \
#                  -f docker-compose.yml -f docker-compose.prod.yml up -d --build
name: distribucion-polar

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-distribucion_polar}
      POSTGRES_USER: ${POSTGRES_USER:-polar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polar_dev_2026}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: distribucion-polar-api:${API_IMAGE_TAG:-latest}
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-distribucion_polar};Username=${POSTGRES_USER:-polar};Password=${POSTGRES_PASSWORD:-polar_dev_2026}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

networks:
  backend:

volumes:
  postgres-data:
