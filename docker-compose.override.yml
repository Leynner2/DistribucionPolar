# Entorno Development: se aplica automáticamente con "docker compose up".
# Puertos abiertos al host, Swagger, usuarios de prueba (appsettings.Development.json) y pgAdmin.
services:
  postgres:
    container_name: distribucion-polar-db
    ports:
      - "5432:5432"

  api:
    container_name: distribucion-polar-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: distribucion-polar-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@distribucionpolar.dev
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev_2026
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass.src:ro
    # libpq ignora un pgpass con permisos abiertos: se copia con permisos 600 antes de arrancar.
    entrypoint: ["/bin/sh", "-c", "cp /pgpass.src /var/lib/pgadmin/pgpass && chmod 600 /var/lib/pgadmin/pgpass && exec /entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
